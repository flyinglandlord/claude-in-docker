services:
  claude-in-docker:
    build:
      context: .
      dockerfile: Containerfile
    hostname: claude-us
    privileged: true
    network_mode: bridge
    env_file:
      - path: ./config/domains.local.env
        required: false
    environment:
      VPS_IP: ${VPS_IP:?set VPS_IP in .env}
      WG_PORT: ${WG_PORT:-51820}
      EXPECTED_EGRESS_IP: ${EXPECTED_EGRESS_IP:-${VPS_IP:?set VPS_IP in .env}}
      TZ: ${TZ:-America/New_York}
      ENABLE_GUI: ${ENABLE_GUI:-true}
      ENABLE_DIND: ${ENABLE_DIND:-true}
      AUTO_CHROME: ${AUTO_CHROME:-true}
      CHROME_URL: ${CHROME_URL:-about:blank}
      VNC_PASSWORD: ${VNC_PASSWORD:-}
    ports:
      - '127.0.0.1:${NOVNC_PORT:-6080}:6080'
    volumes:
      - ./config/tunnel:/etc/cage-peer:ro
      - ./data:/home/claude
      - docker-data:/var/lib/docker
volumes:
  docker-data:
